[package]
name = "reinforcex_ffi"
version = "0.0.1"
license.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[lib]
name = "reinforcex"
crate-type = ["cdylib"]

[dependencies]
reinforcex = { path = "../core", default-features = false }
tch = { workspace = true }
dashmap = "6.1.0"
ulid = "1"

[features]
default = ["cpu"]
cpu = ["reinforcex/cpu"]
cuda = ["reinforcex/cuda"]
